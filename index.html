<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bà xã heo măm măm</title>
<meta name="description" content="Sổ quán ngon của hai đứa: dán link TikTok, xem review Google, tìm quán gần nhất.">
<meta name="theme-color" content="#ff5c93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heo măm măm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pig" viewBox="0 0 100 100">
    <path d="M22 32 L16 8 L42 21 Z" fill="#ff8fb6"/><path d="M78 32 L84 8 L58 21 Z" fill="#ff8fb6"/>
    <circle cx="50" cy="55" r="38" fill="#ffb3cb"/>
    <ellipse cx="29" cy="65" rx="7" ry="4.5" fill="#ff7aa8" opacity=".6"/><ellipse cx="71" cy="65" rx="7" ry="4.5" fill="#ff7aa8" opacity=".6"/>
    <circle cx="36" cy="47" r="4.8" fill="#34172a"/><circle cx="64" cy="47" r="4.8" fill="#34172a"/>
    <circle cx="37.6" cy="45.4" r="1.5" fill="#fff"/><circle cx="65.6" cy="45.4" r="1.5" fill="#fff"/>
    <ellipse cx="50" cy="64" rx="14.5" ry="10.5" fill="#ff7aa8"/>
    <ellipse cx="45" cy="64" rx="2.6" ry="3.8" fill="#c22d63"/><ellipse cx="55" cy="64" rx="2.6" ry="3.8" fill="#c22d63"/>
    <path d="M42 80 Q50 86 58 80" stroke="#c22d63" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></symbol>
</svg>

<div id="map" aria-label="Bản đồ quán ăn"></div>

<div class="top">
  <div class="brand-row">
    <div class="brand"><svg><use href="#pig"/></svg><div><b>Bà xã heo măm măm</b><small id="hello">Sổ quán ngon của hai đứa</small></div></div>
    <button class="round push" id="settingsBtn" aria-label="Cài đặt"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Tìm quán</span><input id="q" type="search" placeholder="Tìm quán, món, khu vực" autocomplete="off"></label>
</div>

<button class="round locate" id="locateBtn" aria-label="Tìm vị trí của tui"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

<section class="sheet" id="sheet" aria-label="Danh sách quán">
  <div class="grab" id="grab"><span></span></div>
  <div class="sheet-head" id="sheetHead">
    <div><h2 id="sheetTitle">Quán đã lưu</h2><p id="sheetSub">Đang tải sổ quán...</p></div>
    <button class="add-btn" id="addBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Thêm quán</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="banner" id="banner" hidden></div>
    <button class="pick" id="pickBtn"><span class="dice">🎲</span>Hôm nay ăn gì?</button>
    <div class="controls">
      <div class="chips" role="group" aria-label="Lọc quán" id="chips">
        <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
        <button class="chip" data-f="todo" aria-pressed="false">Chưa đi</button>
        <button class="chip" data-f="done" aria-pressed="false">Đã đi</button>
        <button class="chip" data-f="love" aria-pressed="false">Thương nhất</button>
        <button class="chip" data-f="hidden" aria-pressed="false">Đã ẩn</button>
      </div>
      <select class="sort" id="sort" aria-label="Sắp xếp">
        <option value="near">Gần nhất</option><option value="star">Sao cao</option><option value="new">Mới thêm</option>
      </select>
    </div>
    <div class="from" id="fromRow"><span>Tính khoảng cách từ</span><select id="fromSel" aria-label="Tính khoảng cách từ"><option value="gps">vị trí của tui</option></select></div>
    <div class="list" id="list"></div>
  </div>
</section>

<div class="page" id="page" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
